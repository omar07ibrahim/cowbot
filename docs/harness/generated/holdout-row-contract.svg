<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="806" viewBox="0 0 1400 806" role="img" aria-labelledby="row-title row-desc">
  <title id="row-title">COWBOT bounded holdout row and reducer contract</title>
  <desc id="row-desc">A source-derived contract diagram showing the 16 KiB strict row decoder, exact plan identity binding, completed and failed row rules, pessimistic reduction over 128-case denominators, and four registered integer gates. It contains no evaluation outcomes.</desc>
  <style>
    .bg { fill: #07111f; }
    .panel { fill: #0d1b2d; stroke: #34506f; stroke-width: 1.5; }
    .verified { fill: #0e292c; stroke: #2dd4bf; stroke-width: 1.8; }
    .unrun { fill: #32141b; stroke: #fb7185; stroke-width: 1.8; }
    .terminal { fill: #050a12; stroke: #334155; stroke-width: 1.5; }
    .title { fill: #f8fafc; font: 700 28px ui-sans-serif, system-ui, sans-serif; }
    .subtitle { fill: #9fb4cb; font: 15px ui-sans-serif, system-ui, sans-serif; }
    .section { fill: #e8f0fa; font: 700 17px ui-sans-serif, system-ui, sans-serif; }
    .body { fill: #c8d6e7; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .small { fill: #9fb4cb; font: 12.5px ui-sans-serif, system-ui, sans-serif; }
    .mono { fill: #d7e3f1; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .mono-small { fill: #bed0e3; font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .hash { fill: #7dd3fc; font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .verified-text { fill: #5eead4; font: 800 14px ui-sans-serif, system-ui, sans-serif; }
    .unrun-text { fill: #fda4af; font: 800 14px ui-sans-serif, system-ui, sans-serif; }
    .number { fill: #f8fafc; font: 800 28px ui-sans-serif, system-ui, sans-serif; }
    .threshold { fill: #f8fafc; font: 800 21px ui-sans-serif, system-ui, sans-serif; }
    .command { fill: #86efac; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .arrow { stroke: #6684a5; stroke-width: 2; }
    .dashed { stroke-dasharray: 7 6; }
    .arrow-head { fill: #6684a5; }
  </style>
  <rect class="bg" width="1400" height="806" rx="18"/>
  <text x="48" y="58" class="title" text-anchor="start">Bounded row validation and adverse reduction</text>
  <text x="48" y="86" class="subtitle" text-anchor="start">Future input contract only · full denominators · integer decisions</text>
  <rect x="48" y="122" width="246" height="168" rx="14" class="panel"/>
  <text x="70" y="158" class="section" text-anchor="start">1 · BOUNDED INPUT</text>
  <text x="70" y="204" class="number" text-anchor="start">16 KiB</text>
  <text x="70" y="234" class="body" text-anchor="start">strict UTF-8 JSON</text>
  <text x="70" y="260" class="small" text-anchor="start">duplicate keys rejected</text>
  <line x1="294" y1="206" x2="312" y2="206" class="arrow"/><path d="M312,199 L326,206 L312,213 Z" class="arrow-head"/>
  <rect x="326" y="122" width="276" height="168" rx="14" class="verified"/>
  <text x="348" y="158" class="verified-text" text-anchor="start">2 · EXACT IDENTITY</text>
  <text x="348" y="194" class="body" text-anchor="start">plan SHA · row · pair · arm</text>
  <text x="348" y="222" class="body" text-anchor="start">seed identity checked</text>
  <text x="348" y="250" class="small" text-anchor="start">unknown / missing fields fail</text>
  <text x="348" y="272" class="small" text-anchor="start">errors expose stable codes only</text>
  <line x1="602" y1="206" x2="620" y2="206" class="arrow"/><path d="M620,199 L634,206 L620,213 Z" class="arrow-head"/>
  <rect x="634" y="122" width="276" height="168" rx="14" class="panel"/>
  <text x="656" y="158" class="section" text-anchor="start">3 · ROW STATUS</text>
  <text x="656" y="198" class="verified-text" text-anchor="start">completed</text>
  <text x="656" y="226" class="small" text-anchor="start">exact arm outcomes required</text>
  <text x="656" y="256" class="unrun-text" text-anchor="start">failed</text>
  <text x="742" y="256" class="small" text-anchor="start">outcomes must be null</text>
  <line x1="910" y1="206" x2="928" y2="206" class="arrow"/><path d="M928,199 L942,206 L928,213 Z" class="arrow-head"/>
  <rect x="942" y="122" width="410" height="168" rx="14" class="unrun"/>
  <text x="964" y="158" class="unrun-text" text-anchor="start">4 · PESSIMISTIC REDUCTION</text>
  <text x="964" y="196" class="body" text-anchor="start">missing · invalid · failed → adverse</text>
  <text x="964" y="226" class="body" text-anchor="start">all denominators remain 128</text>
  <text x="964" y="254" class="small" text-anchor="start">at most 256 rows + 1 extra probe</text>
  <text x="964" y="276" class="small" text-anchor="start">duplicates / reorderings cannot disappear</text>
  <text x="48" y="344" class="section" text-anchor="start">Pre-registered integer gates</text>
  <rect x="48" y="370" width="308" height="126" rx="14" class="verified"/>
  <text x="66" y="407" class="verified-text" text-anchor="start">INCIDENT DETECTION</text>
  <text x="66" y="456" class="threshold" text-anchor="start">≥ 116 / 128</text>
  <text x="66" y="480" class="small" text-anchor="start">fixed complete population</text>
  <rect x="380" y="370" width="308" height="126" rx="14" class="verified"/>
  <text x="398" y="407" class="verified-text" text-anchor="start">TIMELY ROOT LOCALIZATION</text>
  <text x="398" y="456" class="threshold" text-anchor="start">≥ 96 / 128</text>
  <text x="398" y="480" class="small" text-anchor="start">fixed complete population</text>
  <rect x="712" y="370" width="308" height="126" rx="14" class="unrun"/>
  <text x="730" y="407" class="unrun-text" text-anchor="start">INCIDENT PRE-ONSET FA</text>
  <text x="730" y="456" class="threshold" text-anchor="start">≤ 12 / 128</text>
  <text x="730" y="480" class="small" text-anchor="start">fixed complete population</text>
  <rect x="1044" y="370" width="308" height="126" rx="14" class="unrun"/>
  <text x="1062" y="407" class="unrun-text" text-anchor="start">CONTROL FALSE ALARM</text>
  <text x="1062" y="456" class="threshold" text-anchor="start">≤ 12 / 128</text>
  <text x="1062" y="480" class="small" text-anchor="start">fixed complete population</text>
  <rect x="48" y="538" width="1304" height="98" rx="14" class="panel"/>
  <text x="70" y="573" class="body" text-anchor="start">95% Wilson intervals are deterministic reporting fields.</text>
  <text x="70" y="603" class="verified-text" text-anchor="start">They never decide acceptance; only the four registered integer comparisons do.</text>
  <rect x="48" y="670" width="1304" height="88" rx="14" class="unrun"/>
  <text x="70" y="704" class="unrun-text" text-anchor="start">CONTRACT, NOT AN OUTCOME PLOT</text>
  <text x="70" y="732" class="body" text-anchor="start">No frozen row was read or reduced to produce this figure.</text>
</svg>
