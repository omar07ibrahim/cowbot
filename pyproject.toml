[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cowbot-watchdog"
version = "0.1.0"
description = "Graph-informed replayable triage for multivariate telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Omar Ibrahim"}]
dependencies = []

[project.scripts]
cowbot = "cowbot.cli:main"

[tool.setuptools]
packages = ["cowbot"]
